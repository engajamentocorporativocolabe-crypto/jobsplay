<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobsPlay – Protótipo</title>
<style>
:root{--bg:#eef2f8;--surf:#fff;--ink:#0d1f40;--mut:#566a8c;--pri:#133366;--pri2:#1d4a8f;--acc:#fd8000;--line:#d3dcec;--ok:#1d8a4e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09142b;--surf:#102042;--ink:#e8eef8;--mut:#93a6c8;--pri:#3f7bdc;--pri2:#2f67c0;--line:#243a66;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;color:#133366;border-bottom:3px solid var(--acc)}
header .logo{font-weight:700;font-size:18px;color:var(--pri);text-decoration:none}
.mode{display:flex;background:rgba(255,255,255,.15);border-radius:20px;padding:2px}
.mode button{border:0;background:none;color:#fff;padding:5px 12px;border-radius:18px;font:inherit;font-size:13px;cursor:pointer}
.mode button.on{background:var(--acc);color:#0d1f40;font-weight:700}
main{flex:1;overflow-y:auto;padding:16px}
h2{font-size:20px;margin-bottom:4px}p.s{color:var(--mut);margin-bottom:14px}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cat button,.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cat button span{display:block;font-size:24px}.cat button small{color:var(--mut)}
.card{margin-bottom:10px;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{width:100%;border:0;background:var(--pri);color:#fff;padding:14px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
.btn.y{background:var(--acc);color:#0d1f40}.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tag{font-size:12px;background:#e3f4ea;color:var(--ok);padding:2px 8px;border-radius:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{background:#173a2a;color:#6fd59b}}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:12px;padding:12px;font:inherit}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:16px;padding:6px 11px;margin:0 6px 6px 0;background:var(--surf);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#0d1f40;font-weight:700}
.sum{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}.sum div{display:flex;justify-content:space-between;padding:2px 0}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.back{background:none;border:0;color:var(--pri);font:inherit;cursor:pointer;margin-bottom:10px;padding:0}
.steps{display:flex;flex-direction:column;gap:10px;margin:12px 0}.st{display:flex;gap:10px;align-items:center;color:var(--mut)}
.st.d{color:var(--ink);font-weight:700}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.st.d .dot{background:var(--ok);border-color:var(--ok)}
.stars button{background:none;border:0;font-size:32px;cursor:pointer;color:var(--line)}.stars button.on{color:var(--acc)}
.big{font-size:26px;font-weight:700}
input[type=text],input[type=password]{margin-top:4px}
.out{border:1px solid #133366;background:none;color:#133366;border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
nav{display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav:empty{display:none}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:13px 4px;font:inherit;cursor:pointer}
nav button.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
</style>
</head>
<body>
<div id="app">
<header>
  <span class="logo">JobsPlay</span>
  <div id="hr"></div>
</header>
<main id="v"></main>
<nav id="nav"></nav>
</div>
<script>
var S={user:null,mode:'c',screen:'home',cat:null,desc:'',pro:null,days:1,type:'visita',paid:false,stars:0,online:true,reqs:[{n:'Marta – Cohama',s:'Chuveiro não esquenta',v:50,c:4.8,q:23},{n:'Paulo – Turu',s:'Vazamento na pia',v:50,c:4.2,q:6}]};
var CATS=[['⚡','Eletricista','visita'],['🚰','Encanador','visita'],['🪑','Montador de móveis','montagem'],['🧱','Pedreiro','diaria'],['👷','Ajudante de pedreiro','diaria'],['🔧','Reparos diversos','visita']];
var PROS={visita:[['Carlos Mendes',4.9,128,'Renascença','8 min',50],['Joana Silva',4.8,94,'Calhau','12 min',50],['Pedro Lima',4.7,61,'Cohama','15 min',45]],
montagem:[['Rafael Souza',4.9,210,'Cohab','Hoje',0],['Davi Costa',4.7,88,'Turu','Amanhã',0]],
diaria:[['Seu Antônio',4.9,176,'Anil · Seg a Sáb',null,140],['Josué Ramos',4.8,72,'Vinhais · Seg a Sex',null,130]]};
var MOV=[['Guarda-roupa',120],['Cama',70],['Rack de TV',60]];
var mov=0;
function brl(n){return 'R$ '+n.toFixed(2).replace('.',',')}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function go(s){S.screen=s;render()}
function render(){
 var h='',sc=S.screen,T=['home','hist','me'];
 document.getElementById('hr').innerHTML=S.user?'<button class="out" onclick="logout()">Sair</button>':'';
 document.getElementById('nav').innerHTML=S.user&&T.indexOf(sc)>-1?T.map(function(k){var l={home:S.mode=='p'?'Chamados':'Início',hist:'Histórico',me:'Perfil'}[k];return '<button class="'+(sc==k?'on':'')+'" onclick="go(\''+k+'\')">'+l+'</button>'}).join(''):'';
 if(!S.user)h=auth();
 else if(sc=='hist')h=hist();
 else if(sc=='me')h=me();
 else if(S.mode=='p')h=pro();
 else if(sc=='home'){
  h='<h2>O que você precisa?</h2><p class="s">Profissionais verificados em São Luís.</p><div class="cat">';
  CATS.forEach(function(c,i){h+='<button onclick="pick('+i+')"><span>'+c[0]+'</span>'+c[1]+'<br><small>'+(c[2]=='diaria'?'Contrate por diária':c[2]=='montagem'?'Preço por móvel':'Visita a partir de R$ 45')+'</small></button>'});
  h+='</div><button class="btn o" onclick="alert(\'Interesse registrado! Avisaremos quando houver obras fechadas.\')">Preciso de uma obra maior</button><p class="note">Obras fechadas por valor total são combinadas direto com o profissional, fora do app.</p>';
 }
 else if(sc=='desc'){
  var c=CATS[S.cat];
  h='<button class="back" onclick="go(\'home\')">‹ Voltar</button><h2>'+c[1]+'</h2>';
  if(c[2]=='montagem'){h+='<p class="s">Escolha o móvel. O preço é de referência e o profissional confirma.</p><div>';MOV.forEach(function(m,i){h+='<button class="pill'+(mov==i?' on':'')+'" onclick="mov='+i+';render()">'+m[0]+' · '+brl(m[1])+'</button>'});h+='</div>'}
  else if(c[2]=='diaria')h+='<p class="s">Veja quem divulga diária na sua região e escolha os dias.</p>';
  else h+='<p class="s">Descreva o problema para o profissional chegar preparado.</p><textarea id="d" rows="4" placeholder="Ex.: o chuveiro parou de esquentar">'+esc(S.desc)+'</textarea>';
  h+='<button class="btn" onclick="S.desc=(document.getElementById(\'d\')||{value:\'\'}).value;go(\'pros\')">Ver profissionais</button>';
 }
 else if(sc=='pros'){
  var t=CATS[S.cat][2];
  h='<button class="back" onclick="go(\'desc\')">‹ Voltar</button><h2>Profissionais disponíveis</h2><p class="s">Preço visível antes de contratar.</p>';
  PROS[t].forEach(function(p,i){
   var pr=t=='diaria'?brl(p[5])+' / diária':t=='montagem'?brl(MOV[mov][1])+' · '+p[4]:'Visita '+brl(p[5])+' · chega em '+p[4];
   h+='<div class="card"><div class="row"><b>'+p[0]+'</b><span class="tag">Identidade conferida</span></div><div class="s" style="margin:2px 0 6px">★ '+p[1]+' ('+p[2]+') · '+p[3]+'</div><div class="row"><b>'+pr+'</b></div><button class="btn" onclick="S.pro='+i+';S.days=1;go(\'pay\')">Contratar</button></div>';
  });
 }
 else if(sc=='pay'){
  var t=CATS[S.cat][2],p=PROS[t][S.pro],val,rate,lab;
  if(t=='diaria'){val=p[5]*S.days;rate=.11;lab=S.days+(S.days>1?' diárias':' diária')}
  else if(t=='montagem'){val=MOV[mov][1];rate=.11;lab=MOV[mov][0]}
  else{val=p[5];rate=.15;lab='Visita técnica'}S.val=val;
  h='<button class="back" onclick="go(\'pros\')">‹ Voltar</button><h2>Confirmar contratação</h2><p class="s">'+p[0]+' · '+CATS[S.cat][1]+'</p>';
  if(t=='diaria')h+='<div class="seg">'+[1,5,10].map(function(n){return '<button class="'+(S.days==n?'on':'')+'" onclick="S.days='+n+';render()">'+n+(n==10?' (pacote)':'')+'</button>'}).join('')+'</div>';
  h+='<div class="card"><div class="sum" style="border:0;margin:0;padding:0"><div><span>'+lab+'</span><b>'+brl(val)+'</b></div></div><div class="note">Pagamento por Pix ou cartão (até 3x). O telefone do profissional aparece após a confirmação.</div></div>';
  h+='<div class="card note" style="margin:0 0 8px">O JobsPlay conecta clientes e profissionais e processa o pagamento. A execução e o resultado do serviço são responsabilidade de quem o executa.</div>';
  h+='<button class="btn y" onclick="S.paid=true;go(\'track\')">Pagar '+brl(val)+' com Pix</button><button class="btn o" onclick="S.paid=true;go(\'track\')">Pagar com cartão</button>';
 }
 else if(sc=='track'){
  var t=CATS[S.cat][2],p=PROS[t][S.pro];
  h='<h2>Contratação confirmada ✓</h2><p class="s">'+p[0]+' · telefone liberado: (98) 9 9999-0000</p><div class="card"><div class="steps"><div class="st d"><span class="dot"></span>Pagamento confirmado</div><div class="st d"><span class="dot"></span>Profissional a caminho</div><div class="st"><span class="dot"></span>Serviço em andamento</div><div class="st"><span class="dot"></span>Concluído</div></div><div class="note">Avisos também por WhatsApp. Sua nota de cliente (★ 4.8) é visível ao profissional, como a dele é para você.</div></div><button class="btn" onclick="S.stars=0;go(\'rate\')">Simular conclusão</button>';
 }
 else if(sc=='rate'){
  h='<h2>Como foi o serviço?</h2><p class="s">Sua avaliação ajuda outros clientes.</p><div class="stars">';
  for(var i=1;i<6;i++)h+='<button class="'+(S.stars>=i?'on':'')+'" aria-label="'+i+' estrelas" onclick="S.stars='+i+';render()">★</button>';
  h+='</div><textarea rows="3" placeholder="Comentário (opcional)"></textarea><button class="btn" onclick="finish()">Enviar avaliação</button>';
 }
 document.getElementById('v').innerHTML=h;document.getElementById('v').scrollTop=0;
}
function pro(){
 var h='<div class="row"><h2>Olá, '+esc(S.user.name.split(' ')[0])+'</h2><button class="pill'+(S.online?' on':'')+'" onclick="S.online=!S.online;render()">'+(S.online?'Disponível':'Indisponível')+'</button></div><p class="s">Você paga só quando ganha. Sem mensalidade.</p>';
 h+='<div class="card"><div class="s" style="margin:0">Saldo a receber</div><div class="big">R$ 612,50</div><div class="note">Já descontada a taxa do JobsPlay (15% na visita, 11% no serviço).</div></div>';
 h+='<div class="card"><b>Minha diária</b><div class="row" style="margin-top:6px"><span>R$ 140 · Anil e região</span><span class="tag">Seg a Sáb</span></div></div>';
 h+='<h2 style="font-size:17px;margin:14px 0 8px">Chamados</h2>';
 S.reqs.forEach(function(r,i){h+='<div class="card"><div class="row"><b>'+r.n+'</b><b>Cliente ★ '+r.c+' <small>('+r.q+')</small></b></div><div class="s" style="margin:2px 0">'+r.s+'</div><div class="sum"><div><span>Visita</span><span>'+brl(r.v)+'</span></div><div><span>Taxa JobsPlay (15%)</span><span>− '+brl(r.v*.15)+'</span></div><div><b>Você recebe</b><b>'+brl(r.v*.85)+'</b></div></div><div class="row"><button class="btn o" onclick="S.reqs.splice('+i+\',1);render()">Recusar</button><button class="btn" onclick="acc('+i+')">Aceitar</button></div></div>'});
 if(!S.reqs.length)h+='<p class="s">Sem chamados agora. Fique disponível para receber novos pedidos.</p>';
 return h;
}
var A={t:'in',r:'c',cats:[],doc:0,self:0,f:{}};
var HC=[['Eletricista','12/10/2026','Carlos Mendes',50,5],['Montador de móveis','02/10/2026','Rafael Souza',120,5]];
var HP=[['Chuveiro não esquenta','18/10/2026','Marta O.',42.5,5],['Instalação de tomadas','09/10/2026','João P.',85,4]];
function fld(k,l,ty){return '<label class="note" style="display:block;margin-top:8px">'+l+'</label><input type="'+(ty||'text')+'" value="'+esc(A.f[k])+'" oninput="A.f[\''+k+\'\']=this.value">'}
function up(k,l){return '<div class="row" style="margin-top:8px"><span>'+(A[k]?'✓ ':'')+l+'</span><button class="pill'+(A[k]?' on':'')+'" onclick="upl(\''+k+'\')">'+(A[k]?'Enviado':'Enviar foto')+'</button></div>'}
function tc(i){var x=A.cats.indexOf(i);if(x>-1)A.cats.splice(x,1);else A.cats.push(i);render()}
function auth(){
 if(!A.r)return '<h2>Bem-vindo ao JobsPlay</h2><p class="s">Como você quer usar o app?</p><button class="card" style="width:100%;cursor:pointer" onclick="A.r=\'c\';A.t=\'in\';render()"><span style="font-size:28px">🏠</span><br><b>Sou cliente</b><div class="s" style="margin:2px 0 0">Preciso contratar um serviço</div></button><button class="card" style="width:100%;cursor:pointer" onclick="A.r=\'p\';A.t=\'in\';render()"><span style="font-size:28px">🛠️</span><br><b>Sou profissional</b><div class="s" style="margin:2px 0 0">Quero oferecer meus serviços</div></button>';
 var h='<button class="back" onclick="A.r=null;render()">‹ Trocar</button><h2>'+(A.r=='p'?'Sou profissional':'Sou cliente')+'</h2><p class="s">Entre ou crie sua conta.</p>';
 h+='<div class="seg"><button class="'+(A.t=='in'?'on':'')+'" onclick="A.t=\'in\';render()">Entrar</button><button class="'+(A.t=='up'?'on':'')+'" onclick="A.t=\'up\';render()">Criar conta</button></div>';
 if(A.t=='up')h+=fld('n','Nome completo')+fld('t','Telefone (WhatsApp)');
 h+=fld('e','E-mail')+fld('s','Senha','password');
 if(A.t=='up'){
  h+=fld('b',A.r=='p'?'Região de atuação (bairros)':'Bairro');
  if(A.r=='p'){
   h+='<p class="s" style="margin:12px 0 6px">Categorias que você atende</p><div>'+CATS.map(function(c,i){return '<button class="pill'+(A.cats.indexOf(i)>-1?' on':'')+'" onclick="tc('+i+')">'+c[1]+'</button>'}).join('')+'</div>';
   if(A.cats.some(function(i){return CATS[i][2]=='diaria'}))h+=fld('d','Valor da diária (R$)');
   h+='<div class="card" style="margin-top:10px"><b>Verificação de identidade</b><div class="note">Obrigatória para aparecer na busca.</div><label class="note" style="display:flex;gap:8px;align-items:flex-start;margin-top:8px"><input type="checkbox" style="width:auto;margin:2px 0 0" '+(A.consent?'checked':'')+' onchange="A.consent=this.checked;render()"><span>Autorizo o JobsPlay a usar meu documento e minha selfie somente para confirmar minha identidade e dar segurança aos clientes. Os dados ficam protegidos e posso pedir para ver, corrigir ou apagar a qualquer momento.</span></label>'+up('doc','Documento com foto')+up('self','Selfie')+'</div>';
  }
  h+='<p class="note">Ao criar a conta você aceita os termos. O JobsPlay conecta clientes e profissionais; o serviço é de responsabilidade de quem o executa. Seu histórico é privado: o público vê só a sua nota em estrelas.</p>';
 }
 return h+'<button class="btn" onclick="enter()">'+(A.t=='in'?'Entrar':'Criar conta')+'</button>';
}
function enter(){
 var f=A.f,up=A.t=='up';
 if(up&&(!f.n||!f.e||!f.s||!f.t)){alert('Preencha nome, telefone, e-mail e senha.');return}
 if(up&&A.r=='p'&&!A.consent){alert('Para enviar documento e selfie, é preciso autorizar o uso dos dados.');return}
 if(up&&A.r=='p'&&(!A.cats.length||!A.doc||!A.self)){alert('Escolha ao menos uma categoria e envie documento e selfie.');return}
 if(!up&&(!f.e||!f.s)){alert('Informe e-mail e senha.');return}
 S.user={name:f.n||(A.r=='p'?'Carlos Mendes':'Marta Oliveira'),role:A.r,novo:up,reg:f.b||'São Luís',hc:up?[]:HC.slice(),hp:up?[]:HP.slice()};
 S.mode=A.r;S.screen='home';render();
}
function logout(){S.user=null;A.r=null;S.screen='home';render()}
function upl(k){if(!A.consent){alert('Marque a autorização de uso dos dados antes de enviar.');return}A[k]=1;render()}
function del(){if(!confirm('Excluir sua conta e seus dados? Isso não pode ser desfeito.'))return;S.user=null;A.f={};A.doc=0;A.self=0;A.consent=0;A.cats=[];A.r=null;A.t='in';S.screen='home';alert('Conta excluída. Seus dados pessoais foram apagados.');render()}
function stars(n){return n?'★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n):'Aguardando avaliação'}
function hist(){
 var p=S.user.role=='p',L=p?S.user.hp:S.user.hc;
 var h='<h2>'+(p?'Serviços prestados':'Serviços solicitados')+'</h2><p class="s">🔒 Só você vê este histórico.</p>';
 if(!L.length)return h+'<div class="card">Nada por aqui ainda. '+(p?'Aceite um chamado para começar.':'Contrate seu primeiro serviço na tela inicial.')+'</div>';
 L.forEach(function(x){h+='<div class="card"><div class="row"><b>'+esc(x[0])+'</b><b>'+brl(x[3])+'</b></div><div class="s" style="margin:2px 0">'+x[1]+' · '+(p?'Cliente: ':'Profissional: ')+esc(x[2])+'</div><div>'+(p?'Nota recebida: ':'Nota que você deu: ')+stars(x[4])+'</div></div>'});
 return h;
}
function me(){
 var u=S.user,p=u.role=='p',n=u.name.split(' '),pub=n[0]+(n[1]?' '+n[1][0]+'.':''),nota=u.novo?'Novo no JobsPlay':'★ '+(p?'4.9 (128 avaliações)':'4.8 (23 avaliações)');
 var h='<h2>Meu perfil</h2><div class="card"><div class="row"><b>'+esc(u.name)+'</b><span class="tag">'+(p?(u.novo?'Verificação em análise':'Identidade conferida'):'Cliente')+'</span></div><div class="s" style="margin:4px 0 0">'+(A.f.t?esc(A.f.t)+' · ':'')+(A.f.e?esc(A.f.e):'')+'</div><div class="note">🔒 Dados privados, só você vê.</div></div>';
 h+='<p class="s" style="margin-top:14px">Assim os outros veem você:</p><div class="card"><div class="row"><b>'+esc(pub)+'</b><b>'+nota+'</b></div>'+(p?'<div class="s" style="margin:2px 0">'+esc(u.reg)+'</div>':'')+'</div>';
 h+='<button class="btn o" onclick="del()">Excluir minha conta</button><p class="note">Você pode pedir para ver, corrigir ou apagar seus dados. Contato de privacidade: privacidade@jobsplay.com.br (exemplo).</p>';return h+'<p class="note">Publicamente aparecem apenas o nome, a região e a nota em estrelas. Histórico, valores, telefone e e-mail nunca são exibidos.</p>';
}
function acc(i){var r=S.reqs[i];S.user.hp.unshift([r.s,'21/10/2026',r.n,r.v*.85,0]);S.reqs.splice(i,1);alert('Chamado aceito! O telefone do cliente foi liberado.');render()}
function finish(){
 var t=CATS[S.cat][2],pp=PROS[t][S.pro];
 S.user.hc.unshift([CATS[S.cat][1],'21/10/2026',pp[0],S.val,S.stars]);
 alert('Avaliação enviada. Obrigado!');go('home');
}
function pick(i){S.cat=i;S.desc='';mov=0;go('desc')}
render();
</script>
</body>
</html>
